name: Client CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform hosts
        run: |
          flutter create --platforms=android,ios .
          rm -f test/widget_test.dart
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android,ios .
      - run: flutter pub get
      - name: Build optimized split APKs
        run: |
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols/android
          mkdir -p dist/compat
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/pindou.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/compat/pindou-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/compat/pindou-x86_64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: pindou-apk
          path: dist/pindou.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: pindou-apk-compat
          path: dist/compat/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: pindou-android-symbols
          path: build/symbols/android
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android,ios .
      - run: flutter pub get
      - name: Build unsigned release app
        run: flutter build ios --release --no-codesign --obfuscate --split-debug-info=build/symbols/ios
      - name: Package release IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -9qry pindou.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: pindou-ipa
          path: build/ios/ipa/pindou.ipa
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: pindou-ios-symbols
          path: build/symbols/ios
          if-no-files-found: error
